[project]
name = "style-workbench"
version = "0.1.0"
description = "Style Workbench — gemgem.biz 디자이너용 Style 제작 admin 도구"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "python-ulid>=2.2",
  "structlog>=24.4",
  "anthropic>=0.40",
  "openai>=1.50",
  "replicate>=0.34",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "aiosqlite>=0.22.1",
]
phase2 = [
  "arq>=0.26",
  "redis>=5.0",
  "opentelemetry-api>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/style_workbench"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in function defaults is intentional

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "golden: golden-suite regression tests (run with pytest -m golden)",
  "golden_live: live LLM golden tests — requires ANTHROPIC_API_KEY (CI nightly only)",
]
